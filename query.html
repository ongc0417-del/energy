<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>查地址</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f5;color:#333;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px}
h3{text-align:center;margin-bottom:16px}
.input{width:100%;padding:12px;border:1px solid #eee;border-radius:10px;margin:8px 0;font-size:15px}
.btn{width:100%;padding:14px;background:#e6a23c;color:#fff;border:none;border-radius:25px;font-size:16px;margin-top:8px}
#result{margin-top:16px;font-size:14px;line-height:1.8;background:#f8f8f8;padding:12px;border-radius:10px}
.item{display:flex;justify-content:space-between;margin:6px 0}
.label{color:#999}
</style>
</head>
<body>
<div class="card">
  <h3>查地址</h3>
  <input id="addr" class="input" placeholder="输入 TRC20 地址">
  <button class="btn" onclick="query()">查询</button>
  <div id="result"></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

async function query(){
  const addr = document.getElementById('addr').value.trim();
  if(!addr || !addr.startsWith('T')){
    alert('请输入有效的 TRC20 地址');
    return;
  }
  document.getElementById('result').innerHTML = '查询中...';
  try{
    const res = await fetch(`https://apilist.tronscanapi.com/api/accountv2?address=${addr}`);
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    
    let trx = ((data.balance || 0) / 1e6).toFixed(2);
    let usdt = 0;
    let activated = data.balance !== undefined;
    
    if(data.trc20token_balances){
      const u = data.trc20token_balances.find(t => t.tokenAbbr === 'USDT');
      if(u) usdt = (parseFloat(u.balance) / 1e6).toFixed(2);
    }
    
    document.getElementById('result').innerHTML = `
      <div class="item"><span class="label">地址</span><span>${addr.slice(0,8)}...${addr.slice(-6)}</span></div>
      <div class="item"><span class="label">状态</span><span>${activated ? '已激活' : '未激活'}</span></div>
      <div class="item"><span class="label">TRX</span><span>${trx}</span></div>
      <div class="item"><span class="label">USDT</span><span>${usdt}</span></div>
    `;
  }catch(e){
    document.getElementById('result').innerHTML = '<span style="color:#ff4d4f">查询失败，请稍后重试</span>';
  }
}
</script>
</body>
</html>
