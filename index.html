<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRX能量宝</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f5;color:#333;padding-bottom:70px}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}
.header .title{font-size:17px;font-weight:600}
.header .close{color:#007aff;font-size:16px}
.banner{background:#fff9e6;margin:12px 16px;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:space-between}
.banner span{color:#e6a23c;font-size:14px}
.cards{display:flex;gap:12px;margin:0 16px 16px}
.card{flex:1;background:#fff;padding:16px;border-radius:12px}
.card .label{font-size:13px;color:#999;margin-bottom:4px}
.card .value{font-size:22px;font-weight:600}
.card .sub{font-size:12px;color:#999;margin-top:4px}
.section{background:#fff;margin:0 16px 16px;padding:16px;border-radius:12px}
.section-title{font-size:15px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.paste{color:#007aff;font-size:14px}
.input-box{background:#f8f8f8;border:1px solid #eee;border-radius:10px;padding:12px;min-height:48px;font-size:15px;word-break:break-all}
.input-box.active{border-color:#e6a23c}
.btn{background:#e6a23c;color:#fff;border:none;border-radius:25px;padding:14px;font-size:16px;width:100%;margin-top:16px}
.btn:disabled{background:#ddd;color:#999}
.btn-blue{background:#0099ff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;padding:8px 0;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;text-align:center;font-size:12px;color:#999;padding:4px}
.nav-item.active{color:#e6a23c}
.nav-item .icon{font-size:20px;margin-bottom:2px}
.page{display:none}
.page.active{display:block}
</style>
</head>
<body>

<div class="header">
  <span class="close" onclick="tg.close()">关闭</span>
  <span class="title" id="pageTitle">能量领取</span>
  <span></span>
</div>

<!-- 能量领取页 -->
<div class="page active" id="energyPage">
  <div class="banner"><span>⚡ 本能量由平台独家赞助</span></div>
  <div class="cards">
    <div class="card">
      <div class="label">赞助能量</div>
      <div class="value" id="freeCount">3 笔</div>
      <div class="sub">每日 00:00 重置</div>
    </div>
    <div class="card">
      <div class="label">用户余额</div>
      <div class="value">0.00</div>
      <div class="sub">TRX</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">1 能量接收地址 <span class="paste" onclick="pasteAddr('from')">粘贴</span></div>
    <div class="input-box" id="fromBox" onclick="focusInput('from')">输入接收能量的 TRC20 地址</div>
  </div>
  <div class="section">
    <div class="section-title">2 对方收款地址 <span class="paste" onclick="pasteAddr('to')">粘贴</span></div>
    <div class="input-box" id="toBox" onclick="focusInput('to')">输入对方收款地址</div>
  </div>
  <button class="btn" id="submitBtn" disabled onclick="submitOrder()">确认下单</button>
</div>

<!-- USDT 换 TRX 页 -->
<div class="page" id="swapPage">
  <div class="section">
    <div class="section-title" style="text-align:center;">USDT 换 TRX</div>
    <p style="text-align:center;color:#2ecc71;margin-bottom:16px;">当前价格 1 USDT ≈ 3.15 TRX</p>
    <input id="usdtAmount" class="input-box" style="width:100%;border:1px solid #eee;" placeholder="输入 USDT 数量" oninput="calc()">
    <input id="trxAmount" class="input-box" style="width:100%;border:1px solid #eee;margin-top:12px;" placeholder="预计获得 TRX" readonly>
    <input id="receiveAddress" class="input-box" style="width:100%;border:1px solid #eee;margin-top:12px;" placeholder="接收 TRX 地址">
    <button class="btn btn-blue" onclick="submitSwap()">立即兑换</button>
  </div>
</div>

<!-- 查地址页 -->
<div class="page" id="queryPage">
  <div class="section">
    <div class="section-title" style="text-align:center;">查地址</div>
    <input id="queryAddress" class="input-box" style="width:100%;border:1px solid #eee;" placeholder="输入 TRC20 地址">
    <button class="btn" onclick="queryAddr()">查询</button>
    <div id="queryResult" style="margin-top:16px;font-size:14px;line-height:1.6;"></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="showPage('energy')"><div class="icon">⚡</div>能量</div>
  <div class="nav-item" onclick="showPage('swap')"><div class="icon">💰</div>兑换</div>
  <div class="nav-item" onclick="showPage('query')"><div class="icon">🔍</div>查地址</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let freeLeft = 3;
let fromAddr = '', toAddr = '';
let claimedAddresses = JSON.parse(localStorage.getItem('claimedAddresses') || '[]');

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page + 'Page').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const titles = {energy:'能量领取', swap:'USDT换TRX', query:'查地址'};
  document.getElementById('pageTitle').innerText = titles[page] || '能量领取';
  const idx = {energy:0, swap:1, query:2}[page];
  if (idx !== undefined) document.querySelectorAll('.nav-item')[idx].classList.add('active');
  location.hash = page;
}

async function pasteAddr(type) {
  try {
    let text = (await navigator.clipboard.readText()).trim();
    if (!text.startsWith('T') || text.length < 30) return alert('请粘贴有效地址');
    if (type === 'from') {
      fromAddr = text;
      document.getElementById('fromBox').innerText = text;
      document.getElementById('fromBox').classList.add('active');
    } else {
      toAddr = text;
      document.getElementById('toBox').innerText = text;
      document.getElementById('toBox').classList.add('active');
    }
    document.getElementById('submitBtn').disabled = !(fromAddr && toAddr);
  } catch(e) { alert('请手动输入'); }
}

function focusInput(type) {
  const text = prompt(type==='from'?'输入能量接收地址':'输入对方收款地址');
  if (text && text.startsWith('T') && text.length >= 30) {
    if (type === 'from') {
      fromAddr = text;
      document.getElementById('fromBox').innerText = text;
    } else {
      toAddr = text;
      document.getElementById('toBox').innerText = text;
    }
    document.getElementById('submitBtn').disabled = !(fromAddr && toAddr);
  }
}

function submitOrder() {
  if (claimedAddresses.includes(fromAddr)) {
    alert('高危地址，请使用余额购买能量');
    return;
  }
  if (freeLeft < 1) {
    alert('今日免费额度不足，请使用余额购买');
    return;
  }
  freeLeft--;
  claimedAddresses.push(fromAddr);
  localStorage.setItem('claimedAddresses', JSON.stringify(claimedAddresses));
  document.getElementById('freeCount').innerText = freeLeft + ' 笔';
  alert('领取成功');
}

function calc() {
  const usdt = parseFloat(document.getElementById('usdtAmount').value) || 0;
  document.getElementById('trxAmount').value = (usdt * 3.15).toFixed(2);
}

function submitSwap() {
  alert('兑换功能已提交（请接你的后台）');
}

async function queryAddr() {
  const addr = document.getElementById('queryAddress').value.trim();
  if (!addr) return;
  document.getElementById('queryResult').innerHTML = '查询中...';
  try {
    const res = await fetch(`https://apilist.tronscanapi.com/api/accountv2?address=${addr}`);
    const data = await res.json();
    let html = `<p>地址：${addr}</p>`;
    html += `<p>TRX 余额：${(data.balance || 0)/1e6} TRX</p>`;
    const usdt = (data.trc20token_balances || []).find(t => t.tokenAbbr === 'USDT');
    html += `<p>USDT：${usdt ? usdt.balance/1e6 : 0}</p>`;
    document.getElementById('queryResult').innerHTML = html;
  } catch(e) {
    document.getElementById('queryResult').innerHTML = '查询失败';
  }
}

// 根据 hash 打开对应页
const hash = location.hash.replace('#','') || 'energy';
showPage(hash);
</script>
</body>
</html>
