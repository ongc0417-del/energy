<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRX能量宝</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin: 8px 0; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; color: #fff; }
.btn-blue { background: #0099ff; }
.btn-gold { background: #e6b325; }
.result { margin-top: 12px; color: #e74c3c; font-weight: bold; }
.nav { display: flex; justify-content: space-around; background: #fff; padding: 10px 0; position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #eee; }
.nav button { background: none; border: none; font-size: 13px; }
</style>
</head>
<body>
<div id="energyPage" class="page">
  <div class="card">
    <h3 style="text-align:center;">领取能量</h3>
    <input id="energyAddress" class="input" placeholder="输入接收能量的 TRON 地址">
    <button class="btn btn-blue" onclick="checkAndClaim()">领取能量</button>
    <div id="energyResult" class="result"></div>
  </div>
</div>

<div id="swapPage" class="page" style="display:none;">
  <div class="card">
    <h3 style="text-align:center;">USDT 换 TRX</h3>
    <p style="text-align:center;color:#2ecc71;">当前价格 1 USDT ≈ 3.15 TRX</p>
    <input id="usdtAmount" class="input" placeholder="输入 USDT 数量" oninput="calc()">
    <input id="trxAmount" class="input" placeholder="预计获得 TRX" readonly>
    <input id="receiveAddress" class="input" placeholder="接收 TRX 地址">
    <button class="btn btn-blue" onclick="submitSwap()">立即兑换</button>
  </div>
</div>

<div id="queryPage" class="page" style="display:none;">
  <div class="card">
    <h3 style="text-align:center;">查地址</h3>
    <input id="queryAddress" class="input" placeholder="输入 TRC20 地址">
    <button class="btn btn-gold" onclick="queryAddr()">查询</button>
    <div id="queryResult"></div>
  </div>
</div>

<div class="nav">
  <button onclick="showPage('energy')">⚡ 能量</button>
  <button onclick="showPage('swap')">💰 兑换</button>
  <button onclick="showPage('query')">🔍 查地址</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let claimedAddresses = JSON.parse(localStorage.getItem('claimedAddresses') || '[]');

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(page + 'Page').style.display = 'block';
  location.hash = page;
}

function showResult(id, msg) {
  document.getElementById(id).innerText = msg;
}

async function checkAddress(address) {
  // 这里你接 Tronscan 或自己的后台接口
  // 返回示例：{ hasUsdt: false, activated: true }
  return { hasUsdt: false, activated: true };
}

async function checkAndClaim() {
  const address = document.getElementById('energyAddress').value.trim();
  if (!address.startsWith('T') || address.length !== 34) {
    showResult('energyResult', '请输入正确的 TRON 地址');
    return;
  }

  if (claimedAddresses.includes(address)) {
    showResult('energyResult', '高危地址，请使用余额购买能量');
    return;
  }

  const info = await checkAddress(address);
  if (!info.hasUsdt || !info.activated) {
    showResult('energyResult', info.activated ? '高危地址，请使用余额购买能量' : '地址未激活，请使用余额购买能量');
    return;
  }

  const today = new Date().toDateString();
  const todayKey = 'claimCount_' + today;
  let count = parseInt(localStorage.getItem(todayKey) || '0');
  if (count >= 3) {
    showResult('energyResult', '今日免费领取次数已用完，请使用余额购买');
    return;
  }

  count++;
  localStorage.setItem(todayKey, count);
  claimedAddresses.push(address);
  localStorage.setItem('claimedAddresses', JSON.stringify(claimedAddresses));
  showResult('energyResult', '领取成功');
  // 这里调用你实际送能量的接口
}

function calc() {
  const usdt = parseFloat(document.getElementById('usdtAmount').value) || 0;
  document.getElementById('trxAmount').value = (usdt * 3.15).toFixed(2);
}

function submitSwap() {
  alert('兑换功能已提交（请接你的后台）');
}

function queryAddr() {
  const addr = document.getElementById('queryAddress').value.trim();
  document.getElementById('queryResult').innerHTML = '<p>查询中...</p>';
  // 这里接 Tronscan 查询接口
}

// 根据 hash 显示对应页面
const hash = location.hash.replace('#', '') || 'energy';
showPage(hash);
</script>
</body>
</html>
