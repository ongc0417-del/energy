<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能量宝后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f5;color:#333}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:#1a1a2e;color:#fff;padding:20px 0}
.sidebar h2{padding:0 20px;font-size:18px;margin-bottom:20px;color:#7c3aed}
.sidebar a{display:block;padding:12px 20px;color:#ccc;text-decoration:none;transition:background 0.2s}
.sidebar a:hover,.sidebar a.active{background:#7c3aed;color:#fff}
.main{margin-left:200px;padding:20px}
.header{background:#fff;padding:16px 20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.header h1{font-size:20px;color:#7c3aed}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.card .label{font-size:13px;color:#999;margin-bottom:8px}
.card .value{font-size:28px;font-weight:700;color:#7c3aed}
.section{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);margin-bottom:20px}
.section h3{font-size:16px;margin-bottom:16px;color:#333}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
th{background:#f8f8f8;font-weight:600;font-size:13px;color:#666}
.btn{background:#7c3aed;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:#6d28d9}
.btn-danger{background:#ff4d4f}
.btn-danger:hover{background:#ff7875}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;background:#f0f0f0;font-size:14px}
.tab.active{background:#7c3aed;color:#fff}
.page{display:none}
.page.active{display:block}
input,select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-right:8px}
.status-ok{color:#52c41a}
.status-pending{color:#faad14}
.status-fail{color:#ff4d4f}
</style>
</head>
<body>

<div class="sidebar">
  <h2>⚡ 能量宝</h2>
  <a href="#" class="active" onclick="showPage('dashboard')">数据总览</a>
  <a href="#" onclick="showPage('users')">用户管理</a>
  <a href="#" onclick="showPage('orders')">订单管理</a>
  <a href="#" onclick="showPage('deposits')">充值记录</a>
  <a href="#" onclick="showPage('addresses')">地址管理</a>
  <a href="#" onclick="showPage('energy')">发能量</a>
  <a href="#" onclick="showPage('ads')">广告管理</a>
  <a href="#" onclick="showPage('settings')">设置</a>
</div>

<div class="main">
  <div class="header">
    <h1 id="pageTitle">数据总览</h1>
  </div>

  <div class="page active" id="dashboard">
    <div class="cards">
      <div class="card">
        <div class="label">今日用户</div>
        <div class="value" id="todayUsers">0</div>
      </div>
      <div class="card">
        <div class="label">今日订单</div>
        <div class="value" id="todayOrders">0</div>
      </div>
      <div class="card">
        <div class="label">今日收入</div>
        <div class="value" id="todayIncome">0 TRX</div>
      </div>
      <div class="card">
        <div class="label">总用户</div>
        <div class="value" id="totalUsers">0</div>
      </div>
    </div>
    <div class="section">
      <h3>最近订单</h3>
      <table>
        <thead><tr><th>时间</th><th>用户</th><th>类型</th><th>金额</th><th>状态</th></tr></thead>
        <tbody id="recentOrders"><tr><td colspan="5" style="text-align:center;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="users">
    <div class="section">
      <h3>用户列表</h3>
      <div style="margin-bottom:16px">
        <input id="userSearch" placeholder="搜索用户ID">
        <button class="btn" onclick="loadUsers()">搜索</button>
      </div>
      <table>
        <thead><tr><th>用户ID</th><th>余额</th><th>领取次数</th><th>注册时间</th></tr></thead>
        <tbody id="userList"><tr><td colspan="4" style="text-align:center;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="orders">
    <div class="section">
      <h3>订单列表</h3>
      <div class="tabs">
        <span class="tab active" onclick="loadOrders('all')">全部</span>
        <span class="tab" onclick="loadOrders('energy')">能量</span>
        <span class="tab" onclick="loadOrders('swap')">换TRX</span>
      </div>
      <table>
        <thead><tr><th>订单号</th><th>用户</th><th>类型</th><th>金额</th><th>状态</th><th>时间</th></tr></thead>
        <tbody id="orderList"><tr><td colspan="6" style="text-align:center;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="deposits">
    <div class="section">
      <h3>充值记录</h3>
      <table>
        <thead><tr><th>时间</th><th>来源地址</th><th>金额</th><th>状态</th><th>用户</th></tr></thead>
        <tbody id="depositList"><tr><td colspan="5" style="text-align:center;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="addresses">
    <div class="section">
      <h3>已领取能量的地址</h3>
      <table>
        <thead><tr><th>地址</th><th>领取次数</th><th>最后领取</th></tr></thead>
        <tbody id="addressList"><tr><td colspan="3" style="text-align:center;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="energy">
    <div class="section">
      <h3>手动发能量</h3>
      <div style="margin-bottom:16px">
        <input id="energyAddr" placeholder="输入地址" style="width:300px">
        <select id="energyCount">
          <option value="1">1 笔</option>
          <option value="2">2 笔</option>
          <option value="5">5 笔</option>
          <option value="10">10 笔</option>
        </select>
        <button class="btn" onclick="sendEnergy()">发送</button>
      </div>
      <div id="energyResult" style="color:#52c41a;margin-top:12px"></div>
    </div>
  </div>

  <div class="page" id="ads">
    <div class="section">
      <h3>发广告</h3>
      <div style="margin-bottom:16px">
        <input id="adText" placeholder="广告内容" style="width:400px">
        <button class="btn" onclick="sendAd()">发送</button>
      </div>
      <h3 style="margin-top:20px">广告历史</h3>
      <table>
        <thead><tr><th>内容</th><th>发送时间</th><th>操作</th></tr></thead>
        <tbody id="adList"><tr><td colspan="3" style="text-align:center;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="settings">
    <div class="section">
      <h3>价格设置</h3>
      <div style="margin-bottom:16px">
        <label>能量价格（TRX/笔）：</label>
        <input id="energyPrice" type="number" value="2" style="width:100px">
      </div>
      <div style="margin-bottom:16px">
        <label>换TRX汇率（1 USDT = ? TRX）：</label>
        <input id="swapRate" type="number" value="3.15" step="0.01" style="width:100px">
      </div>
      <div style="margin-bottom:16px">
        <label>每日免费笔数：</label>
        <input id="freeCount" type="number" value="3" style="width:100px">
      </div>
      <button class="btn" onclick="saveSettings()">保存设置</button>
      <div id="settingsResult" style="color:#52c41a;margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';

async function api(path, options = {}){
  try{
    const res = await fetch(API + path, {
      headers: {'Content-Type': 'application/json'},
      ...options
    });
    return await res.json();
  }catch(e){
    console.error(e);
    return null;
  }
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  event.target.classList.add('active');
  const titles = {dashboard:'数据总览',users:'用户管理',orders:'订单管理',deposits:'充值记录',addresses:'地址管理',energy:'发能量',ads:'广告管理',settings:'设置'};
  document.getElementById('pageTitle').innerText = titles[id] || '后台';
  
  if(id === 'dashboard') loadDashboard();
  if(id === 'users') loadUsers();
  if(id === 'orders') loadOrders('all');
  if(id === 'deposits') loadDeposits();
  if(id === 'addresses') loadAddresses();
  if(id === 'ads') loadAds();
  if(id === 'settings') loadSettings();
}

async function loadDashboard(){
  const data = await api('/api/dashboard');
  if(!data) return;
  document.getElementById('todayUsers').innerText = data.today_users;
  document.getElementById('todayOrders').innerText = data.today_orders;
  document.getElementById('todayIncome').innerText = data.today_income + ' TRX';
  document.getElementById('totalUsers').innerText = data.total_users;
  
  const tbody = document.getElementById('recentOrders');
  if(data.recent_orders.length === 0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999">暂无数据</td></tr>';
  }else{
    tbody.innerHTML = data.recent_orders.map(o => `
      <tr>
        <td>${o.created_at?.slice(0,16) || '-'}</td>
        <td>${o.user_id || '-'}</td>
        <td>${o.type || '-'}</td>
        <td>${o.amount || 0}</td>
        <td class="status-${o.status === 'completed' ? 'ok' : 'pending'}">${o.status || '-'}</td>
      </tr>
    `).join('');
  }
}

async function loadUsers(){
  const search = document.getElementById('userSearch').value;
  const data = await api('/api/users' + (search ? '?search=' + search : ''));
  const tbody = document.getElementById('userList');
  if(!data || data.length === 0){
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999">暂无数据</td></tr>';
  }else{
    tbody.innerHTML = data.map(u => `
      <tr>
        <td>${u.user_id}</td>
        <td>${u.balance || 0} TRX</td>
        <td>${u.claim_count || 0}</td>
        <td>${u.created_at?.slice(0,16) || '-'}</td>
      </tr>
    `).join('');
  }
}

async function loadOrders(type){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  const data = await api('/api/orders' + (type !== 'all' ? '?type=' + type : ''));
  const tbody = document.getElementById('orderList');
  if(!data || data.length === 0){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999">暂无数据</td></tr>';
  }else{
    tbody.innerHTML = data.map(o => `
      <tr>
        <td>${o.order_id}</td>
        <td>${o.user_id || '-'}</td>
        <td>${o.type}</td>
        <td>${o.amount}</td>
        <td class="status-${o.status === 'completed' ? 'ok' : 'pending'}">${o.status}</td>
        <td>${o.created_at?.slice(0,16) || '-'}</td>
      </tr>
    `).join('');
  }
}

async function loadDeposits(){
  const data = await api('/api/deposits');
  const tbody = document.getElementById('depositList');
  if(!data || data.length === 0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999">暂无数据</td></tr>';
  }else{
    tbody.innerHTML = data.map(d => `
      <tr>
        <td>${d.created_at?.slice(0,16) || '-'}</td>
        <td>${d.from_address?.slice(0,10) || '-'}...</td>
        <td>${d.amount} TRX</td>
        <td class="status-${d.status === 'completed' ? 'ok' : 'pending'}">${d.status}</td>
        <td>${d.user_id || '-'}</td>
      </tr>
    `).join('');
  }
}

async function loadAddresses(){
  const data = await api('/api/addresses');
  const tbody = document.getElementById('addressList');
  if(!data || data.length === 0){
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999">暂无数据</td></tr>';
  }else{
    tbody.innerHTML = data.map(a => `
      <tr>
        <td>${a.address}</td>
        <td>${a.claim_count}</td>
        <td>${a.last_claim?.slice(0,16) || '-'}</td>
      </tr>
    `).join('');
  }
}

async function sendEnergy(){
  const addr = document.getElementById('energyAddr').value;
  const count = parseInt(document.getElementById('energyCount').value);
  if(!addr || !addr.startsWith('T')){
    alert('请输入有效地址');
    return;
  }
  const data = await api('/api/energy/send', {
    method: 'POST',
    body: JSON.stringify({address: addr, count: count})
  });
  if(data && data.success){
    document.getElementById('energyResult').innerText = data.message;
  }else{
    document.getElementById('energyResult').innerText = '发送失败';
  }
}

async function loadAds(){
  const data = await api('/api/ads');
  const tbody = document.getElementById('adList');
  if(!data || data.length === 0){
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999">暂无广告</td></tr>';
  }else{
    tbody.innerHTML = data.map(a => `
      <tr>
        <td>${a.content}</td>
        <td>${a.created_at?.slice(0,16) || '-'}</td>
        <td><button class="btn btn-danger" onclick="deleteAd(${a.id})">删除</button></td>
      </tr>
    `).join('');
  }
}

async function sendAd(){
  const text = document.getElementById('adText').value;
  if(!text){
    alert('请输入广告内容');
    return;
  }
  await api('/api/ads', {
    method: 'POST',
    body: JSON.stringify({content: text})
  });
  document.getElementById('adText').value = '';
  loadAds();
}

async function deleteAd(id){
  await api('/api/ads/' + id, {method: 'DELETE'});
  loadAds();
}

async function loadSettings(){
  const data = await api('/api/settings');
  if(data){
    document.getElementById('energyPrice').value = data.energy_price || 2;
    document.getElementById('swapRate').value = data.swap_rate || 3.15;
    document.getElementById('freeCount').value = data.free_count || 3;
  }
}

async function saveSettings(){
  await api('/api/settings', {
    method: 'POST',
    body: JSON.stringify({key: 'energy_price', value: document.getElementById('energyPrice').value})
  });
  await api('/api/settings', {
    method: 'POST',
    body: JSON.stringify({key: 'swap_rate', value: document.getElementById('swapRate').value})
  });
  await api('/api/settings', {
    method: 'POST',
    body: JSON.stringify({key: 'free_count', value: document.getElementById('freeCount').value})
  });
  document.getElementById('settingsResult').innerText = '设置已保存';
}

loadDashboard();
</script>
</body>
</html>
